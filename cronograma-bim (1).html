<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma BIM — Gestión de proyectos</title>
<style>
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f6f8fc;
  --ink:#16213a; --ink-2:#4a5468; --ink-3:#8b94a7;
  --line:#e4e9f1; --line-2:#cdd5e2;
  --accent:#2b54e6; --accent-soft:#e9eefc; --accent-ink:#1c3bb0;
  --danger:#e0394a; --danger-soft:#fceaec;
  --warn:#c47d00; --warn-soft:#fbf0d8;
  --ok:#1f9d57; --ok-soft:#e6f6ec;
  --we-bg:#eef2f8; --ho-bg:rgba(196,125,0,.13); --ab-bg:rgba(224,57,74,.12);
  --dayW:30px; --labelW:230px; --rowH:38px; --rail:228px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
  --shadow:0 1px 2px rgba(20,33,58,.06),0 4px 16px rgba(20,33,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent)}

/* layout */
#app{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:#0f1830;color:#c8d0e2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .glyph{width:30px;height:30px;border:1.5px solid #5b7cf0;border-radius:7px;position:relative;flex:0 0 auto}
.brand .glyph::before,.brand .glyph::after{content:"";position:absolute;background:#5b7cf0}
.brand .glyph::before{left:6px;right:6px;top:13px;height:1.5px}
.brand .glyph::after{top:6px;bottom:6px;left:13px;width:1.5px}
.brand b{font-size:14px;color:#fff;letter-spacing:.2px;line-height:1.1}
.brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7e8aa8;margin-top:2px}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#aab4cc;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;letter-spacing:.1px}
.nav button .ico{width:16px;height:16px;flex:0 0 auto;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06);color:#e7ecf7}
.nav button.active{background:var(--accent);color:#fff}
.nav button.active .ico{opacity:1}
.rail-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#727e9c}
.rail-foot .num{color:#9aa5c0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(236,239,244,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.2px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.spacer{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:#aab6c9;background:#fbfcfe}
.btn .ico{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2447c9}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:rgba(20,33,58,.05)}
.btn.danger{color:var(--danger);border-color:#f0c4c8}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.content{padding:22px 24px 60px;max-width:1500px;width:100%}

/* cards / grid */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:27px;font-weight:680;margin-top:7px;letter-spacing:-.5px}
.kpi .val.num{font-weight:600}
.kpi.alert .val{color:var(--danger)}
.kpi .foot{font-size:12px;color:var(--ink-2);margin-top:3px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-h h2{font-size:14px;margin:0;font-weight:640;letter-spacing:.1px}
.panel-h .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.panel-b{padding:6px 0}
.panel-b.pad{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t-name{font-weight:560}
.t-sub{font-size:11.5px;color:var(--ink-3)}
.right{text-align:right}
.center{text-align:center}
.muted{color:var(--ink-3)}

/* chips / badges */
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:560;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.badge.pend{background:#eef1f6;color:#586074}
.badge.curso{background:var(--accent-soft);color:var(--accent-ink)}
.badge.hecha{background:var(--ok-soft);color:var(--ok)}
.badge.bloq{background:var(--warn-soft);color:var(--warn)}
.badge.risk{background:var(--danger-soft);color:var(--danger)}
.pill-person{display:inline-flex;align-items:center;gap:7px;font-weight:560}

/* progress */
.prog{height:7px;border-radius:99px;background:#e9edf4;overflow:hidden;min-width:60px}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog.ok>i{background:var(--ok)}

/* load bars */
.load-row{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--line)}
.load-row:last-child{border-bottom:0}
.load-name{width:90px;flex:0 0 auto;display:flex;align-items:center;gap:8px;font-weight:560;font-size:13px}
.load-bar{flex:1;height:20px;background:#eef1f6;border-radius:6px;position:relative;overflow:hidden}
.load-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.9}
.load-bar>.cap{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-3)}
.load-val{width:118px;flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--ink-2)}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-size:12.5px;font-weight:560;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
.field-inline{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
select.mini,input.mini{border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);font-weight:520}

/* gantt */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:560px}
.gantt-inner{display:inline-block;min-width:100%}
.ghead{position:sticky;top:0;z-index:6;background:var(--surface);box-shadow:0 1px 0 var(--line-2)}
.grow{display:flex;align-items:stretch}
.gmonths,.gdays{display:flex}
.gcorner{position:sticky;left:0;z-index:7;background:var(--surface);min-width:var(--labelW);max-width:var(--labelW);width:var(--labelW);border-right:1px solid var(--line-2);display:flex;align-items:center;padding:0 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.gmonth{flex:0 0 auto;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line);padding:7px 10px;font-size:12px;font-weight:600;text-transform:capitalize;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.gday{flex:0 0 var(--dayW);width:var(--dayW);text-align:center;font-size:10.5px;color:var(--ink-3);padding:5px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gday.we{background:var(--we-bg)}
.gday.ho{background:var(--ho-bg);color:var(--warn);font-weight:600}
.gbody .grow{border-bottom:1px solid var(--line)}
.gbody .grow:hover .gtrack{background-color:rgba(43,84,230,.025)}
.ggroup{display:flex;align-items:center;background:var(--surface-2);position:sticky;left:0}
.ggroup .glabel{background:var(--surface-2);font-weight:650;font-size:12px;color:var(--ink);text-transform:none;letter-spacing:0;flex-direction:row;align-items:center;gap:8px}
.glabel{position:sticky;left:0;z-index:4;background:var(--surface);min-width:var(--labelW);max-width:var(--labelW);width:var(--labelW);padding:6px 14px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;gap:2px}
.glabel .gl-name{font-size:12.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel .gl-meta{font-size:10.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center}
.gtrack{position:relative;flex:0 0 auto;height:var(--rowH);background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--dayW))}
.gshade{position:absolute;top:0;bottom:0}
.gshade.we{background:var(--we-bg)}
.gshade.ho{background:var(--ho-bg)}
.gshade.ab{background:var(--ab-bg)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:5;box-shadow:0 0 0 1px rgba(43,84,230,.18)}
.gbar{position:absolute;top:7px;height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11.5px;font-weight:560;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.18);z-index:3;cursor:pointer}
.gbar .pct{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.45)}
.gbar span{position:relative;z-index:2;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.gbar.risk{outline:2px solid var(--danger);outline-offset:-2px}
.gdl{position:absolute;top:3px;bottom:3px;width:0;border-left:2px dashed var(--danger);z-index:4}
.gdl::after{content:"⚑";position:absolute;top:-2px;left:1px;font-size:10px;color:var(--danger)}
.empty{padding:40px;text-align:center;color:var(--ink-3);font-size:13.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);padding:10px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:13px;height:11px;border-radius:3px;display:inline-block}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,24,48,.46);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,24,48,.3);overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h h3{margin:0;font-size:15.5px;font-weight:640}
.modal-b{padding:18px 20px;display:grid;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:var(--surface-2)}
.frow{display:grid;gap:6px}
.frow.two{grid-template-columns:1fr 1fr;gap:14px}
.frow label{font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.frow input,.frow select,.frow textarea{border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;background:var(--surface);color:var(--ink);width:100%}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.frow .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.frow .check input{width:auto}
.x{border:0;background:none;font-size:20px;color:var(--ink-3);line-height:1;padding:4px}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);padding:0}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.rowact{display:inline-flex;gap:5px}

/* responsive rail */
.menubtn{display:none}
@media(max-width:900px){
  #app{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;align-items:center;position:sticky;top:0;z-index:30;overflow-x:auto}
  .brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.08);padding:12px 16px}
  .nav{flex-direction:row;flex:1;padding:8px}
  .nav button{width:auto;white-space:nowrap}
  .nav button .ico{display:none}
  .rail-foot{display:none}
}

/* print */
.print-only{display:none}
@media print{
  .rail,.topbar .actions,.toolbar,.no-print,.modal-bg,.legend{display:none!important}
  body,#app,.main{background:#fff!important}
  .content{padding:0;max-width:none}
  .topbar{position:static;background:#fff;border:0;padding:0 0 6px}
  .print-only{display:block;margin-bottom:14px}
  .print-only h1{font-size:20px;margin:0}
  .print-only .pmeta{font-size:12px;color:#555;font-family:var(--mono)}
  .panel,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .gantt{max-height:none;overflow:visible}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand">
      <div class="glyph"></div>
      <div><b>Cronograma BIM</b><small>Arqly · Modelado</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">Última edición<br><span class="num" id="lastsave">—</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Resumen</h1>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="spacer"></div>
      <div class="actions no-print">
        <button class="btn" data-act="export-json"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Respaldo</button>
        <button class="btn" data-act="export-pdf"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>Exportar PDF</button>
        <button class="btn primary" data-act="add-task"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nueva tarea</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modal-root"></div>

<script>
"use strict";
/* ============================================================
   ALMACENAMIENTO  (localStorage con respaldo en memoria)
   ============================================================ */
const STORE_KEY = "cronograma_bim_v1";
const mem = {};
const storage = {
  get(k){ try{ const v=localStorage.getItem(k); return v; }catch(e){ return (k in mem)?mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* ============================================================
   UTILIDADES DE FECHA
   ============================================================ */
function fmtDate(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function startOfDay(d){const r=new Date(d);r.setHours(0,0,0,0);return r;}
function today(){return startOfDay(new Date());}
function daysBetween(a,b){return Math.round((startOfDay(b)-startOfDay(a))/86400000);}
function isWeekend(d){const w=d.getDay();return w===0||w===6;}
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtHuman(s){ if(!s) return '—'; const d=parseDate(s); return `${String(d.getDate()).padStart(2,'0')} ${MESES[d.getMonth()]}`; }
function uid(p){return (p||'id')+Math.random().toString(36).slice(2,8);}

/* ============================================================
   FESTIVOS DE COLOMBIA (cómputo automático por año)
   ============================================================ */
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function nextMonday(date){const d=new Date(date);const wd=d.getDay();if(wd===1)return d;const add=(8-wd)%7;d.setDate(d.getDate()+add);return d;}
function colombiaHolidays(year){
  const easter=easterSunday(year);
  const addD=(base,n)=>{const d=new Date(base);d.setDate(d.getDate()+n);return d;};
  const list=[];
  const fixed=(m,d,n)=>list.push({date:new Date(year,m-1,d),nombre:n});
  const emi=(m,d,n)=>list.push({date:nextMonday(new Date(year,m-1,d)),nombre:n});
  const emiE=(o,n)=>list.push({date:nextMonday(addD(easter,o)),nombre:n});
  const fixE=(o,n)=>list.push({date:addD(easter,o),nombre:n});
  fixed(1,1,'Año Nuevo'); emi(1,6,'Reyes Magos'); emi(3,19,'San José');
  fixE(-3,'Jueves Santo'); fixE(-2,'Viernes Santo'); fixed(5,1,'Día del Trabajo');
  emiE(39,'Ascensión'); emiE(60,'Corpus Christi'); emiE(68,'Sagrado Corazón');
  emi(6,29,'San Pedro y San Pablo'); fixed(7,20,'Independencia'); fixed(8,7,'Batalla de Boyacá');
  emi(8,15,'Asunción de la Virgen'); emi(10,12,'Día de la Raza'); emi(11,1,'Todos los Santos');
  emi(11,11,'Independencia de Cartagena'); fixed(12,8,'Inmaculada Concepción'); fixed(12,25,'Navidad');
  return list.map((h,i)=>({id:'fer'+year+'_'+i,fecha:fmtDate(h.date),nombre:h.nombre}));
}

/* ============================================================
   ESTADO Y DATOS DE EJEMPLO (seed)
   ============================================================ */
const PERSON_COLORS=['#2563eb','#16a34a','#ea580c','#7c3aed','#0891b2','#db2777','#ca8a04','#0d9488'];
const PROJECT_COLORS=['#0ea5e9','#f59e0b','#8b5cf6','#10b981','#ef4444','#6366f1'];

function seed(){
  const T=today();
  const iso=(n)=>fmtDate(addDays(T,n));
  const created=fmtDate(addDays(T,-7))+'T08:00';
  const yr=T.getFullYear();
  const fer=[...colombiaHolidays(yr),...colombiaHolidays(yr+1)];

  const personas=[
    {id:'pe1',nombre:'Daniel',color:PERSON_COLORS[0],capacidadDiaria:8,activo:true},

/* ============================================================
   MOTOR DE AGENDA POR CAPACIDAD
   ============================================================ */
function holidaySet(){return new Set(state.feriados.map(f=>f.fecha));}
function isAbsent(d,personaId){const s=fmtDate(d);return state.ausencias.some(a=>a.personaId===personaId&&s>=a.fechaInicio&&s<=a.fechaFin);}
function isWorkingDay(d,persona,hset){if(isWeekend(d))return false;if(hset.has(fmtDate(d)))return false;if(isAbsent(d,persona.id))return false;return true;}

function computeSchedule(){
  const hset=holidaySet();
  const res={};
  const start0=today();
  state.personas.forEach(persona=>{
    const tasks=state.tareas
      .filter(t=>t.personaId===persona.id && t.estado!=='hecha')
      .sort((a,b)=>(a.prioridad-b.prioridad)||((a.fechaCreacion||'')>(b.fechaCreacion||'')?1:-1));
    let cursor=new Date(start0);let usedToday=0;
    const cap=Math.max(0.5,persona.capacidadDiaria||8);let guard=0;
    tasks.forEach(task=>{
      let remaining=(task.horasEstimadas||0)*(1-(task.avance||0)/100);
      if(remaining<0)remaining=0;
      let tStart=null,tEnd=null;const segs=[];
      if(remaining<=1e-9){
        while(!isWorkingDay(cursor,persona,hset)){cursor=addDays(cursor,1);usedToday=0;if(++guard>5000)break;}
        tStart=new Date(cursor);tEnd=new Date(cursor);
      }else{
        while(remaining>1e-9){
          if(++guard>20000)break;
          if(!isWorkingDay(cursor,persona,hset)||usedToday>=cap-1e-9){cursor=addDays(cursor,1);usedToday=0;continue;}
          if(tStart===null)tStart=new Date(cursor);
          const avail=cap-usedToday;const use=Math.min(avail,remaining);
          remaining-=use;usedToday+=use;segs.push({date:fmtDate(cursor),hours:use});
          tEnd=new Date(cursor);
        }
      }
      const atRisk=task.deadline?(fmtDate(tEnd)>task.deadline):false;
      res[task.id]={startStr:fmtDate(tStart),endStr:fmtDate(tEnd),segments:segs,atRisk};
    });
  });
  return res;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function remainingHours(t){return (t.horasEstimadas||0)*(1-(t.avance||0)/100);}
const ESTADOS={pendiente:'Pendiente',en_curso:'En curso',hecha:'Hecha',bloqueada:'Bloqueada'};
const ESTADO_CLS={pendiente:'pend',en_curso:'curso',hecha:'hecha',bloqueada:'bloq'};

function personDot(p){return `<span class="dot" style="background:${p.color}"></span>`;}
function personPill(id){const p=persona(id);return `<span class="pill-person">${personDot(p)}${esc(p.nombre)}</span>`;}

function estadoBadge(t,sch){

}

/* ============================================================
   GANTT
   ============================================================ */
function ganttHTML(tasks, sch, opt){
  opt=opt||{};
  const colorBy=opt.colorBy||UI.colorBy;
  const groupBy=opt.groupBy||'proyecto';
  const scheduled=tasks.filter(t=>sch[t.id]&&sch[t.id].startStr&&t.estado!=='hecha');
  if(!scheduled.length) return '<div class="empty">No hay tareas programadas. Crea una tarea para verla en el cronograma.</div>';

  let minD=null,maxD=null;
  scheduled.forEach(t=>{const s=sch[t.id];const st=parseDate(s.startStr),en=parseDate(s.endStr);
    if(!minD||st<minD)minD=st; if(!maxD||en>maxD)maxD=en;
    if(t.deadline){const dl=parseDate(t.deadline); if(dl<minD)minD=dl; if(dl>maxD)maxD=dl;}});
  const tod=today(); if(tod<minD)minD=tod;
  minD=addDays(minD,-2); maxD=addDays(maxD,3);
  let total=daysBetween(minD,maxD)+1; if(total>420)total=420;
  const DW=30;
  const hset=holidaySet();

  // cabecera meses
  let months='';let i=0;
  while(i<total){const d=addDays(minD,i);const y=d.getFullYear(),m=d.getMonth();let span=0;
    while(i+span<total){const dd=addDays(minD,i+span);if(dd.getFullYear()!==y||dd.getMonth()!==m)break;span++;}
    const lab=d.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    months+=`<div class="gmonth" style="width:${span*DW}px">${lab}</div>`; i+=span;}
  // cabecera días
  let days='';
  for(let j=0;j<total;j++){const d=addDays(minD,j);const cls=isWeekend(d)?'we':(hset.has(fmtDate(d))?'ho':'');
    days+=`<div class="gday ${cls}">${d.getDate()}</div>`;}

  // sombreado base (findes + festivos), reutilizable
  let baseShade='';
  for(let j=0;j<total;j++){const d=addDays(minD,j);
    if(isWeekend(d))baseShade+=`<div class="gshade we" style="left:${j*DW}px;width:${DW}px"></div>`;
    else if(hset.has(fmtDate(d)))baseShade+=`<div class="gshade ho" style="left:${j*DW}px;width:${DW}px"></div>`;}
  const todayOff=daysBetween(minD,tod);
  const todayLine=(todayOff>=0&&todayOff<total)?`<div class="gtoday" style="left:${todayOff*DW+DW/2}px"></div>`:'';

  function absShade(pid){let s='';for(let j=0;j<total;j++){const d=addDays(minD,j);
    if(!isWeekend(d)&&!hset.has(fmtDate(d))&&isAbsent(d,pid))s+=`<div class="gshade ab" style="left:${j*DW}px;width:${DW}px"></div>`;}return s;}

  function bar(t){
    const s=sch[t.id];const st=parseDate(s.startStr),en=parseDate(s.endStr);
    const off=daysBetween(minD,st);const dur=daysBetween(st,en)+1;
    const left=off*DW+2;const w=Math.max(16,dur*DW-4);
    const col=colorBy==='persona'?persona(t.personaId).color:proyecto(t.proyectoId).color;
    const pct=Math.min(100,Math.max(0,t.avance||0));
    let dl='';
    if(t.deadline){const dlo=daysBetween(minD,parseDate(t.deadline));if(dlo>=0&&dlo<total)dl=`<div class="gdl" style="left:${dlo*DW+DW/2}px"></div>`;}
    const label=`${remainingHours(t)>0?Math.round(remainingHours(t)):0}h`;
    return `${dl}<div class="gbar ${s.atRisk?'risk':''}" style="left:${left}px;width:${w}px;background:${col}" data-act="edit-task" data-id="${t.id}" title="${esc(t.nombre)} · ${fmtHuman(s.startStr)}→${fmtHuman(s.endStr)}">${pct>0?`<i class="pct" style="width:${pct}%"></i>`:''}<span>${esc(t.nombre)} · ${label}</span></div>`;
  }

  // agrupar
  const groups={};const order=[];
  scheduled.forEach(t=>{const key=groupBy==='persona'?t.personaId:(groupBy==='proyecto'?t.proyectoId:'all');
    if(!groups[key]){groups[key]=[];order.push(key);} groups[key].push(t);});

  let body='';
  order.forEach(key=>{
    if(groupBy!=='none'){
      const name=groupBy==='persona'?persona(key).nombre:proyecto(key).nombre;
      const color=groupBy==='persona'?persona(key).color:proyecto(key).color;
      body+=`<div class="grow ggroup"><div class="glabel"><span class="dot" style="background:${color}"></span>${esc(name)}</div><div class="gtrack" style="width:${total*DW}px;background:var(--surface-2)"></div></div>`;
    }
    groups[key].sort((a,b)=>sch[a.id].startStr.localeCompare(sch[b.id].startStr));
    groups[key].forEach(t=>{
      const s=sch[t.id];
      const meta = groupBy==='persona'
        ? `<span class="dot" style="background:${proyecto(t.proyectoId).color}"></span>${esc(proyecto(t.proyectoId).nombre)}`
        : `<span class="dot" style="background:${persona(t.personaId).color}"></span>${esc(persona(t.personaId).nombre)}`;
      body+=`<div class="grow"><div class="glabel"><span class="gl-name">${esc(t.nombre)}</span><span class="gl-meta">${meta}</span></div>`
          + `<div class="gtrack" style="width:${total*DW}px">${baseShade}${absShade(t.personaId)}${todayLine}${bar(t)}</div></div>`;
    });
  });

  return `<div class="gantt"><div class="gantt-inner">
    <div class="ghead">
      <div class="grow"><div class="gcorner">${total} días</div><div class="gmonths">${months}</div></div>
      <div class="grow"><div class="gcorner" style="font-size:10px">Tarea</div><div class="gdays">${days}</div></div>
    </div>
    <div class="gbody">${body}</div>
  </div></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--accent)"></span>Hoy</span>
    <span><span class="sw" style="background:var(--we-bg)"></span>Fin de semana</span>
    <span><span class="sw" style="background:var(--ho-bg)"></span>Festivo</span>
    <span><span class="sw" style="background:var(--ab-bg)"></span>Ausencia</span>
    <span><span style="color:var(--danger)">⚑</span> Deadline / riesgo</span>
    <span class="muted">La barra clara dentro indica el % de avance · clic en una barra para editar</span>
  </div>`;
}

/* ---- RESUMEN ---- */
function viewResumen(sch){
  header('Resumen','Vista general para presentar al dueño');
  const activeTasks=state.tareas.filter(t=>t.estado!=='hecha');
  const risky=activeTasks.filter(t=>sch[t.id]&&sch[t.id].atRisk);
  const totalH=state.tareas.reduce((s,t)=>s+(t.horasEstimadas||0),0);
  const doneH=state.tareas.reduce((s,t)=>s+(t.horasEstimadas||0)*(t.avance||0)/100,0);
  const avg=totalH?Math.round(doneH/totalH*100):0;

  // próximas entregas
  const upcoming=activeTasks.filter(t=>sch[t.id]).slice().sort((a,b)=>sch[a.id].endStr.localeCompare(sch[b.id].endStr)).slice(0,8);

  // carga por persona (horas pendientes)
  const loads=state.personas.filter(p=>p.activo!==false).map(p=>{
    const h=state.tareas.filter(t=>t.personaId===p.id&&t.estado!=='hecha').reduce((s,t)=>s+remainingHours(t),0);
    return {p,h,dias:h/Math.max(1,p.capacidadDiaria||8)};
  });
  const maxLoad=Math.max(1,...loads.map(l=>l.h));

  const print=`<div class="print-only"><h1>Cronograma BIM — Resumen de entregas</h1><div class="pmeta">Generado: ${new Date().toLocaleString('es-CO')} · Avance global ${avg}% · ${risky.length} tarea(s) en riesgo</div></div>`;

  const kpis=`<div class="kpis">
    <div class="kpi"><div class="lab">Proyectos</div><div class="val num">${state.proyectos.length}</div></div>
    <div class="kpi"><div class="lab">Tareas activas</div><div class="val num">${activeTasks.length}</div><div class="foot">${state.tareas.length-activeTasks.length} completadas</div></div>
    <div class="kpi ${risky.length?'alert':''}"><div class="lab">En riesgo</div><div class="val num">${risky.length}</div><div class="foot">fecha proyectada &gt; deadline</div></div>
    <div class="kpi"><div class="lab">Avance global</div><div class="val num">${avg}%</div><div class="foot">${Math.round(doneH)}h de ${Math.round(totalH)}h</div></div>
  </div>`;

  const projRows=state.proyectos.map(pr=>{
    const ts=state.tareas.filter(t=>t.proyectoId===pr.id);
    const th=ts.reduce((s,t)=>s+(t.horasEstimadas||0),0);
    const dh=ts.reduce((s,t)=>s+(t.horasEstimadas||0)*(t.avance||0)/100,0);
    const pc=th?Math.round(dh/th*100):0;
    const ppl=[...new Set(ts.map(t=>t.personaId))];
    const rk=ts.filter(t=>sch[t.id]&&sch[t.id].atRisk).length;
    const ends=ts.filter(t=>sch[t.id]).map(t=>sch[t.id].endStr).sort();
    return `<tr style="cursor:pointer" data-act="goto-proj" data-id="${pr.id}">
      <td><span class="chip"><span class="dot" style="background:${pr.color}"></span><b>${esc(pr.nombre)}</b></span><div class="t-sub" style="margin-top:4px">${esc(pr.cliente||'')}</div></td>
      <td>${ppl.map(id=>personDot(persona(id))).join(' ')} <span class="muted num">${ppl.length}</span></td>
      <td class="num">${ts.length}</td>
      <td>${rk?`<span class="badge risk">⚑ ${rk}</span>`:'<span class="muted">—</span>'}</td>
      <td class="num">${ends.length?fmtHuman(ends[ends.length-1]):'—'}</td>
      <td style="min-width:140px"><div style="display:flex;align-items:center;gap:8px"><div class="prog ${pc===100?'ok':''}" style="flex:1"><i style="width:${pc}%"></i></div><span class="num muted" style="width:34px">${pc}%</span></div></td>
    </tr>`;
  }).join('');

  const upRows=upcoming.map(t=>{
    const s=sch[t.id];
    return `<tr data-act="edit-task" data-id="${t.id}" style="cursor:pointer">
      <td><div class="t-name">${esc(t.nombre)}</div><div class="t-sub">${esc(proyecto(t.proyectoId).nombre)}</div></td>
      <td>${personPill(t.personaId)}</td>
      <td class="num">${fmtHuman(s.endStr)}</td>
      <td class="num muted">${t.deadline?fmtHuman(t.deadline):'—'}</td>
      <td>${s.atRisk?'<span class="badge risk">⚑ Riesgo</span>':'<span class="badge hecha" style="background:var(--ok-soft)">A tiempo</span>'}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="5" class="empty">Sin entregas pendientes.</td></tr>`;

  const loadRows=loads.map(l=>`
    <div class="load-row">
      <div class="load-name">${personDot(l.p)}${esc(l.p.nombre)}</div>
      <div class="load-bar"><i style="width:${Math.round(l.h/maxLoad*100)}%;background:${l.p.color}"></i></div>
      <div class="load-val"><span class="num">${Math.round(l.h)}h</span> · <span class="num">${l.dias.toFixed(1)}</span> días</div>
    </div>`).join('')||'<div class="empty">Sin carga asignada.</div>';

  const toolbar=`<div class="toolbar no-print">
    <span class="field-inline">Color por</span>
    <div class="seg" data-seg="colorBy">
      <button class="${UI.colorBy==='proyecto'?'on':''}" data-act="colorby" data-v="proyecto">Proyecto</button>
      <button class="${UI.colorBy==='persona'?'on':''}" data-act="colorby" data-v="persona">Persona</button>

    `<div class="grid2">
      <div class="panel"><div class="panel-h"><span class="eyebrow">Entregas</span><h2>Proyectos y estado</h2></div>
        <table><thead><tr><th>Proyecto</th><th>Equipo</th><th>Tareas</th><th>Riesgo</th><th>Última entrega</th><th>Avance</th></tr></thead><tbody>${projRows}</tbody></table>
      </div>
      <div class="panel"><div class="panel-h"><span class="eyebrow">Carga</span><h2>Horas pendientes por persona</h2></div><div class="panel-b">${loadRows}</div></div>
    </div>`+
    `<div class="panel"><div class="panel-h"><span class="eyebrow">Próximo</span><h2>Próximas entregas</h2></div>
      <table><thead><tr><th>Tarea</th><th>Responsable</th><th>Fin proyectado</th><th>Deadline</th><th>Estado</th></tr></thead><tbody>${upRows}</tbody></table>
    </div>`;
}

  </div>`;

  return `<div class="panel" style="margin-bottom:18px"><div class="panel-h" style="border-bottom:0"><span class="chip" style="font-size:13px"><span class="dot" style="background:${pr.color}"></span><b>${esc(pr.nombre)}</b></span><span class="muted">${esc(pr.cliente||'')}</span><div class="spacer"></div><span class="muted">Inicio ${fmtHuman(pr.fechaInicio)}</span></div></div>`+

/* ---- MODELADORES ---- */
function viewModeladores(sch){
  if(!UI.person||!byId(state.personas,UI.person)) UI.person=state.personas[0]?state.personas[0].id:null;
  header('Modeladores','Carga y cronograma por persona');
  if(!UI.person) return '<div class="empty">No hay personas.</div>';
  const p=persona(UI.person);
  const ts=state.tareas.filter(t=>t.personaId===UI.person&&t.estado!=='hecha')
    .sort((a,b)=>(a.prioridad-b.prioridad)||((a.fechaCreacion||'')>(b.fechaCreacion||'')?1:-1));
  const done=state.tareas.filter(t=>t.personaId===UI.person&&t.estado==='hecha');
  const pendH=ts.reduce((s,t)=>s+remainingHours(t),0);
  const cap=p.capacidadDiaria||8;
  const aus=state.ausencias.filter(a=>a.personaId===UI.person);

  const opts=state.personas.map(x=>`<option value="${x.id}" ${x.id===UI.person?'selected':''}>${esc(x.nombre)}</option>`).join('');
  const toolbar=`<div class="toolbar"><select class="mini" data-act="sel-person">${opts}</select>
    <button class="btn sm" data-act="add-task-person"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Asignar tarea</button>
    <button class="btn sm" data-act="add-absence-person"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Registrar ausencia</button>
  </div>`;

  const kpis=`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
    <div class="kpi"><div class="lab">Capacidad</div><div class="val num">${cap}h<span style="font-size:14px;color:var(--ink-3)">/día</span></div></div>
    <div class="kpi"><div class="lab">Pendiente</div><div class="val num">${Math.round(pendH)}h</div><div class="foot">${ts.length} tareas activas</div></div>
    <div class="kpi"><div class="lab">Días de trabajo</div><div class="val num">${(pendH/cap).toFixed(1)}</div><div class="foot">a su capacidad actual</div></div>
    <div class="kpi"><div class="lab">Ausencias</div><div class="val num">${aus.length}</div></div>
  </div>`;

  const rows=ts.map((t,idx)=>{
    const s=sch[t.id]||{};
    return `<tr>
      <td class="num muted" style="width:36px">${idx+1}</td>
      <td><div class="t-name">${esc(t.nombre)}</div><div class="t-sub">${esc(proyecto(t.proyectoId).nombre)}${t.esEspontanea?' · ⚡ espontánea':''}</div></td>
      <td>${projChip(t.proyectoId)}</td>
      <td class="num">${t.horasEstimadas||0}h</td>
      <td class="num">${fmtHuman(s.startStr)} → ${fmtHuman(s.endStr)}</td>
      <td class="num muted">${t.deadline?fmtHuman(t.deadline):'—'}</td>
      <td>${estadoBadge(t,sch)}</td>
      <td class="right"><div class="rowact">
        <button class="iconbtn" data-act="up" data-id="${t.id}" ${idx===0?'disabled':''} title="Subir prioridad">▲</button>
        <button class="iconbtn" data-act="down" data-id="${t.id}" ${idx===ts.length-1?'disabled':''} title="Bajar prioridad">▼</button>
        <button class="iconbtn" data-act="edit-task" data-id="${t.id}" title="Editar">✎</button>
      </div></td>
    </tr>`;
  }).join('')||`<tr><td colspan="8" class="empty">Sin tareas activas para ${esc(p.nombre)}.</td></tr>`;

  const ausHTML=aus.map(a=>`<div class="load-row"><div style="flex:1">📅 <span class="num">${fmtHuman(a.fechaInicio)}</span> → <span class="num">${fmtHuman(a.fechaFin)}</span> <span class="muted">· ${esc(a.motivo||'Ausencia')}</span></div><button class="iconbtn" data-act="del-absence" data-id="${a.id}" title="Quitar">✕</button></div>`).join('')||'<div class="empty" style="padding:18px">Sin ausencias registradas.</div>';

  const doneHTML=done.length?`<div class="panel"><div class="panel-h"><span class="eyebrow">Histórico</span><h2>Tareas completadas (${done.length})</h2></div><table><tbody>${done.map(t=>`<tr><td><div class="t-name">${esc(t.nombre)}</div><div class="t-sub">${esc(proyecto(t.proyectoId).nombre)}</div></td><td>${projChip(t.proyectoId)}</td><td class="num">${t.horasEstimadas||0}h</td><td><span class="badge hecha">Hecha</span></td><td class="right"><button class="iconbtn" data-act="edit-task" data-id="${t.id}">✎</button></td></tr>`).join('')}</tbody></table></div>`:'';

  return `<div class="panel" style="margin-bottom:18px"><div class="panel-h" style="border-bottom:0"><span class="chip" style="font-size:14px"><span class="dot" style="background:${p.color}"></span><b>${esc(p.nombre)}</b></span></div></div>`+
    toolbar+kpis+
    `<div class="panel"><div class="panel-h"><span class="eyebrow">Cronograma</span><h2>Línea de tiempo de ${esc(p.nombre)}</h2></div><div class="panel-b pad">${ganttHTML(ts,sch,{colorBy:UI.colorBy,groupBy:'none'})}</div></div>`+
    `<div class="panel"><div class="panel-h"><span class="eyebrow">Cola de trabajo</span><h2>Tareas en orden de prioridad</h2><div class="spacer"></div><span class="muted" style="font-size:12px">Usa ▲▼ para reordenar — el cronograma se recalcula solo</span></div>
      <table><thead><tr><th>#</th><th>Tarea</th><th>Proyecto</th><th>Horas</th><th>Programado</th><th>Deadline</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`+
    `<div class="grid2"><div class="panel"><div class="panel-h"><span class="eyebrow">Disponibilidad</span><h2>Ausencias</h2></div><div class="panel-b">${ausHTML}</div></div><div>${doneHTML}</div></div>`;
}

/* ---- CALENDARIO ---- */
function viewCalendario(){
  header('Calendario','Festivos y ausencias que afectan el cronograma');
  const yr=today().getFullYear();
  const fer=state.feriados.filter(f=>parseDate(f.fecha)>=addDays(today(),-31)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,30);
  const ferRows=fer.map(f=>{const d=parseDate(f.fecha);const wd=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()];
    const past=d<today();
    return `<tr style="${past?'opacity:.45':''}"><td class="num">${fmtHuman(f.fecha)}</td><td class="muted">${wd}</td><td class="t-name">${esc(f.nombre)}</td><td class="right"><button class="iconbtn" data-act="del-holiday" data-id="${f.id}" title="Quitar">✕</button></td></tr>`;}).join('');

  const aus=state.ausencias.slice().sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  const ausRows=aus.map(a=>`<tr><td>${personPill(a.personaId)}</td><td class="num">${fmtHuman(a.fechaInicio)} → ${fmtHuman(a.fechaFin)}</td><td class="muted">${esc(a.motivo||'—')}</td><td class="right"><button class="iconbtn" data-act="del-absence" data-id="${a.id}">✕</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">Sin ausencias registradas.</td></tr>`;

  return `<div class="grid2">
    <div class="panel"><div class="panel-h"><span class="eyebrow">No laborables</span><h2>Festivos de Colombia ${yr}</h2><div class="spacer"></div><button class="btn sm" data-act="add-holiday">+ Festivo</button></div>
      <table><thead><tr><th>Fecha</th><th>Día</th><th>Festivo</th><th></th></tr></thead><tbody>${ferRows}</tbody></table></div>
    <div class="panel"><div class="panel-h"><span class="eyebrow">Disponibilidad</span><h2>Ausencias del equipo</h2><div class="spacer"></div><button class="btn sm" data-act="add-absence">+ Ausencia</button></div>
      <table><thead><tr><th>Persona</th><th>Periodo</th><th>Motivo</th><th></th></tr></thead><tbody>${ausRows}</tbody></table></div>
  </div>
  <div class="panel"><div class="panel-b pad"><span class="muted">Los festivos y las ausencias se descuentan automáticamente de los días laborables, lo que mueve las fechas proyectadas. Por eso cada mes tiene un número distinto de horas hábiles.</span></div></div>`;
}

/* ============================================================
   MODALES Y FORMULARIOS
   ============================================================ */
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function openModal(title,bodyHTML,onSave,saveLabel){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-bg" data-bg="1"><div class="modal">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="x" data-close="1">×</button></div>
    <div class="modal-b">${bodyHTML}</div>
    <div class="modal-f"><button class="btn ghost" data-close="1">Cancelar</button><button class="btn primary" id="modalSave">${esc(saveLabel||'Guardar')}</button></div>
  </div></div>`;
  root.querySelector('[data-bg]').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal();});
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  root.querySelector('#modalSave').addEventListener('click',()=>{ if(onSave()!==false) closeModal(); });
}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function checked(id){const e=document.getElementById(id);return e?e.checked:false;}

function selectOptions(arr,sel,label){return arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(label?label(x):x.nombre)}</option>`).join('');}

function taskModal(task){
  const isNew=!task;
  task=task||{proyectoId:UI.tab==='proyectos'?UI.proj:(state.proyectos[0]||{}).id,
    personaId:UI.tab==='modeladores'?UI.person:(state.personas[0]||{}).id,
    nombre:'',horasEstimadas:8,avance:0,prioridad:1,deadline:null,asignadorId:(state.asignadores[0]||{}).id,estado:'pendiente',notas:'',esEspontanea:false};
  const body=`
    <div class="frow"><label>Nombre de la tarea</label><input id="f_nombre" value="${esc(task.nombre)}" placeholder="Ej. Modelado conduit Nivel 1"></div>
    <div class="frow two">
      <div class="frow"><label>Proyecto</label><select id="f_proj">${selectOptions(state.proyectos,task.proyectoId)}</select></div>
      <div class="frow"><label>Responsable</label><select id="f_person">${selectOptions(state.personas,task.personaId)}</select></div>
    </div>
    <div class="frow two">
      <div class="frow"><label>Horas estimadas</label><input id="f_horas" type="number" min="0" step="1" value="${task.horasEstimadas||0}"></div>
      <div class="frow"><label>Avance (%)</label><input id="f_avance" type="number" min="0" max="100" step="5" value="${task.avance||0}"></div>
    </div>
    <div class="frow two">
      <div class="frow"><label>Deadline (opcional)</label><input id="f_deadline" type="date" value="${task.deadline||''}"></div>
      <div class="frow"><label>Prioridad (menor = primero)</label><input id="f_prio" type="number" step="1" value="${task.prioridad!=null?task.prioridad:1}"></div>
    </div>
    <div class="frow two">
      <div class="frow"><label>Estado</label><select id="f_estado">${Object.keys(ESTADOS).map(k=>`<option value="${k}" ${k===task.estado?'selected':''}>${ESTADOS[k]}</option>`).join('')}</select></div>
      <div class="frow"><label>Asignado por</label><select id="f_asg">${selectOptions(state.asignadores,task.asignadorId)}</select></div>
    </div>
    <div class="frow"><label>Notas</label><textarea id="f_notas" rows="2" placeholder="Detalles, referencias...">${esc(task.notas||'')}</textarea></div>
    <div class="frow"><label class="check"><input type="checkbox" id="f_esp" ${task.esEspontanea?'checked':''}> Tarea espontánea (no estaba en el cronograma inicial)</label></div>
  `;
  openModal(isNew?'Nueva tarea':'Editar tarea',body,()=>{
    const nombre=val('f_nombre').trim();
    if(!nombre){alert('Ponle un nombre a la tarea.');return false;}
    const data={proyectoId:val('f_proj'),personaId:val('f_person'),nombre,
      horasEstimadas:Math.max(0,parseFloat(val('f_horas'))||0),
      avance:Math.min(100,Math.max(0,parseFloat(val('f_avance'))||0)),
      deadline:val('f_deadline')||null,prioridad:parseFloat(val('f_prio'))||0,
      estado:val('f_estado'),asignadorId:val('f_asg'),notas:val('f_notas'),esEspontanea:checked('f_esp')};
    if(isNew){ data.id=uid('ta'); data.fechaCreacion=new Date().toISOString(); state.tareas.push(data); }
    else { Object.assign(task,data); }
    save(); render();
  }, isNew?'Crear tarea':'Guardar cambios');
}

  const isNew=!p; const usedColors=state.personas.map(x=>x.color);
  const color=p?p.color:(PERSON_COLORS.find(c=>!usedColors.includes(c))||PERSON_COLORS[0]);
  p=p||{nombre:'',capacidadDiaria:8,activo:true,color};
  const body=`
    <div class="frow"><label>Nombre</label><input id="f_n" value="${esc(p.nombre)}"></div>
    <div class="frow two">
      <div class="frow"><label>Capacidad diaria (horas)</label><input id="f_cap" type="number" min="1" max="24" step="1" value="${p.capacidadDiaria||8}"></div>
      <div class="frow"><label>Color</label><input id="f_col" type="color" value="${p.color}" style="height:42px;padding:4px"></div>

    <div class="frow"><label class="check"><input type="checkbox" id="f_act" ${p.activo!==false?'checked':''}> Activo</label></div>`;
  openModal(isNew?'Nueva persona':'Editar persona',body,()=>{

    save();render();
  });
}

function absenceModal(presetPerson){
  const body=`
    <div class="frow"><label>Persona</label><select id="f_p">${selectOptions(state.personas,presetPerson||(state.personas[0]||{}).id)}</select></div>

function asgModal(){
  const body=`<div class="frow"><label>Nombre</label><input id="f_n" placeholder="Nombre de quien asigna"></div>`;
  openModal('Nuevo asignador',body,()=>{const n=val('f_n').trim();if(!n){alert('Nombre requerido.');return false;}state.asignadores.push({id:uid('as'),nombre:n});save();render();});
}

/* ============================================================
   ACCIONES (reordenar, borrar, importar/exportar, etc.)
   ============================================================ */
function reorder(id,dir){
  const t=byId(state.tareas,id); if(!t)return;
  const list=state.tareas.filter(x=>x.personaId===t.personaId&&x.estado!=='hecha')
    .sort((a,b)=>(a.prioridad-b.prioridad)||((a.fechaCreacion||'')>(b.fechaCreacion||'')?1:-1));
  const i=list.indexOf(t); const j=i+dir; if(j<0||j>=list.length)return;
  // reasignar prioridades secuenciales y luego intercambiar
  list.forEach((x,k)=>x.prioridad=k);
  const a=list[i],b=list[j]; const tmp=a.prioridad;a.prioridad=b.prioridad;b.prioridad=tmp;
  save();render();
}
function delTask(id){const t=byId(state.tareas,id);if(t&&confirm(`¿Eliminar la tarea "${t.nombre}"?`)){state.tareas=state.tareas.filter(x=>x.id!==id);save();render();}}

function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cronograma-bim-'+fmtDate(today())+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const data=JSON.parse(r.result);
      if(!data.personas||!data.tareas){alert('El archivo no tiene el formato esperado.');return;}
      state=data;['personas','asignadores','proyectos','tareas','ausencias','feriados'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[];});
      save();render();alert('Datos importados correctamente.');
    }catch(e){alert('No se pudo leer el archivo: '+e.message);}};
    r.readAsText(f);};
  inp.click();
}
function resetData(){if(confirm('Esto reemplaza todo por los datos de ejemplo. ¿Continuar?')){state=seed();save();render();}}

/* ============================================================
   ENRUTADOR DE EVENTOS
   ============================================================ */
const ACTIONS={
  'add-task':()=>taskModal(null),
  'add-task-proj':()=>{taskModal(null);},
  'add-task-person':()=>{taskModal(null);},
  'edit-task':(id)=>{const t=byId(state.tareas,id);if(t)taskModal(t);},
  'up':(id)=>reorder(id,-1),
  'down':(id)=>reorder(id,1),
  'goto-proj':(id)=>{UI.proj=id;UI.tab='proyectos';render();},
  'sel-proj':null,'sel-person':null,
  'add-person':()=>personModal(null),
  'edit-person':(id)=>personModal(byId(state.personas,id)),
  'del-person':(id)=>{const p=byId(state.personas,id);const n=state.tareas.filter(t=>t.personaId===id).length;
    if(confirm(`¿Eliminar a ${p.nombre}?`+(n?` Tiene ${n} tarea(s) que también se eliminarán.`:''))){state.tareas=state.tareas.filter(t=>t.personaId!==id);state.ausencias=state.ausencias.filter(a=>a.personaId!==id);state.personas=state.personas.filter(p=>p.id!==id);save();render();}},
  'add-proj':()=>projModal(null),
  'edit-proj':(id)=>projModal(byId(state.proyectos,id)),
  'del-proj':(id)=>{const p=byId(state.proyectos,id);const n=state.tareas.filter(t=>t.proyectoId===id).length;
    if(confirm(`¿Eliminar el proyecto ${p.nombre}?`+(n?` Tiene ${n} tarea(s) que también se eliminarán.`:''))){state.tareas=state.tareas.filter(t=>t.proyectoId!==id);state.proyectos=state.proyectos.filter(p=>p.id!==id);save();render();}},
  'add-asg':()=>asgModal(),
  'del-asg':(id)=>{state.asignadores=state.asignadores.filter(a=>a.id!==id);save();render();},
  'add-absence':()=>absenceModal(null),
  'add-absence-person':()=>absenceModal(UI.person),
  'del-absence':(id)=>{state.ausencias=state.ausencias.filter(a=>a.id!==id);save();render();},
  'add-holiday':()=>holidayModal(),
  'del-holiday':(id)=>{state.feriados=state.feriados.filter(f=>f.id!==id);save();render();},
  'export-json':()=>exportJSON(),
  'import-json':()=>importJSON(),
  'reset':()=>resetData(),
  'export-pdf':()=>{UI.tab='resumen';render();setTimeout(()=>window.print(),120);},
  'colorby':(v)=>{UI.colorBy=v;render();},
  'ganttgroup':(v)=>{UI.ganttGroup=v;render();},
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act; const id=el.dataset.id; const v=el.dataset.v;
  if(act==='sel-proj'||act==='sel-person')return; // manejado por change
  const fn=ACTIONS[act];
  if(fn){ e.preventDefault(); fn(v!==undefined?v:id); }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  if(el.dataset.act==='sel-proj'){UI.proj=el.value;render();}
  if(el.dataset.act==='sel-person'){UI.person=el.value;render();}
});

  {id:'proyectos',label:'Proyectos',icon:'<path d="M3 7h18M3 7l1.5 12a2 2 0 0 0 2 1.7h11a2 2 0 0 0 2-1.7L21 7M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>'},

];
function buildNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>
    `<button data-tab="${t.id}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${t.icon}</svg>${t.label}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{UI.tab=b.dataset.tab;render();}));
}

load();
buildNav();
save();
render();
</script>
